  - '<!i><yellow>⌚ <#94958B>Cooldown: <arg:5>s'
  - ' '
  - <#94958B>A powerful overhead chop that deals moderate damage.
  - <#94958B>If the target has Stability or Resistance, this ability
  - <#94958B>removes those effects and briefly stuns the target.
  - <#94958B>Otherwise, it applies a moderate Slow.
  - ' '
  - <!i><#757575>Vanguard | Basic
  de:
  - '<!i><yellow>🐌 <#94958B>Verlangsamungsdauer: <arg:1>s (ohne Buff)'
  - '<!i><yellow>🛡️ <#94958B>Betäubungsdauer: <arg:2>s (nach Entfernen eines Buffs)'
  - '<!i><yellow>📏 <#94958B>Reichweite: <arg:3> Blöcke'
  - '<!i><yellow>⚡ <#94958B>Energiegewinn: <arg:4>'
  - '<!i><yellow>⌚ <#94958B>Abklingzeit: <arg:5>s'
  - ' '
  - <#94958B>Ein kraftvoller Überkopfhieb, der moderaten Schaden verursacht.
  - <#94958B>Hat das Ziel Stabilität oder Resistenz, entfernt diese
  - <#94958B>Fähigkeit den Effekt und betäubt das Ziel kurz.
  - <#94958B>Andernfalls wird es moderat verlangsamt.
  - ' '
  - <!i><#757575>Vorhut | Basis
