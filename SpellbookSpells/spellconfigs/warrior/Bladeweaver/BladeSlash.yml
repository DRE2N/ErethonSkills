  - <#94958B>hitting enemies twice.
  - ' '
  - '<!i><yellow>⌚ <#94958B>Cooldown: <arg:0>s'
  - '<!i><yellow>⚡ <#94958B>Energy Gain: <arg:1>'
  - '<!i><yellow>📏 <#94958B>Range: <arg:3> blocks'
  de:
  - <!i><#757575>Klingenweaver
  - ' '
  - <#94958B>Wirf ein Geisterschwert, das Feinde durchbohrt
  - <#94958B>und jedem getroffenen Ziel eine Rasierklingen-Markierung gibt.
  - ' '
  - '<#FF6600>⚔ Dämonenform: <#94958B>Die Klinge kehrt wie ein Bumerang zurück'
  - <#94958B>und trifft Feinde zweimal.
  - ' '
  - '<!i><yellow>⌚ <#94958B>Abklingzeit: <arg:0>s'
  - '<!i><yellow>⚡ <#94958B>Energiegewinn: <arg:1>'
  - '<!i><yellow>📏 <#94958B>Reichweite: <arg:3> Blöcke'
