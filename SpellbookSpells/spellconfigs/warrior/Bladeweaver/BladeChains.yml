class: warrior.bladeweaver.BladeChains
cooldown: 14
energyBuildUpFromUse: 15
chainRange: 12
chainAngle: 60
tetherDuration: 60
pullStrength: 0.15
chainBreakDistance: 15
demonDotInterval: 10
coefficients:
  players:
    chainHitDamage:
      minecraft:advantage_physical: 0.5
    dotDamage:
      minecraft:advantage_physical: 0.3
    singleTargetDamage:
      minecraft:advantage_physical: 2
  entities:
    chainHitDamage:
      minecraft:advantage_physical: 0.8
    dotDamage:
      minecraft:advantage_physical: 0.5
    singleTargetDamage:
      minecraft:advantage_physical: 4
name:
  de: Klingenketten
  en: Blade Chains
description:
  en:
  - <!i><#757575>Bladeweaver
  - ' '
  - <#94958B>Throw chains in a cone that tether enemies together.
  - <#94958B>Tethered enemies are pulled towards each other over time.
  - <#94958B>Requires at least 2 targets for full effect.
  - ' '
  - '<#FF6600>⚔ Demon Form: <#94958B>Chains also apply Razor Marks and'
  - <#94958B>deal damage over time to all tethered enemies.
  - ' '
  - '<!i><yellow>⌚ <#94958B>Cooldown: <arg:0>s'
  - '<!i><yellow>⚡ <#94958B>Energy Gain: <arg:1>'
  - '<!i><yellow>📏 <#94958B>Range: <arg:2> blocks'
  - '<!i><yellow>📐 <#94958B>Cone Angle: <arg:3>°'
  - '<!i><yellow>⏱️ <#94958B>Tether Duration: <arg:4> ticks'
  de:
  - <!i><#757575>Klingenweaver
  - ' '
  - <#94958B>Wirf Ketten in einem Kegel, die Feinde aneinander fesseln.
  - <#94958B>Gefesselte Feinde werden im Laufe der Zeit zueinander gezogen.
  - <#94958B>Benötigt mindestens 2 Ziele für volle Wirkung.
  - ' '
  - '<#FF6600>⚔ Dämonenform: <#94958B>Ketten geben auch Rasierklingen-Markierungen'
  - <#94958B>und verursachen Schaden über Zeit bei allen gefesselten Feinden.
  - ' '
  - '<!i><yellow>⌚ <#94958B>Abklingzeit: <arg:0>s'
  - '<!i><yellow>⚡ <#94958B>Energiegewinn: <arg:1>'
  - '<!i><yellow>📏 <#94958B>Reichweite: <arg:2> Blöcke'
  - '<!i><yellow>📐 <#94958B>Kegelwinkel: <arg:3>°'
  - '<!i><yellow>⏱️ <#94958B>Fesseldauer: <arg:4> Ticks'
# This list contains all placeholders that can be used in this spell.
# You can use those placeholders in the description with
# <arg:(index of placeholder)>. Example: <arg:1> for the first placeholder.
availablePlaceholders:
  '0': cooldown
  '1': energyBuildUpFromUse
  '2': chainRange
  '3': chainAngle
  '4': tetherDuration
  '5': pullStrength
  '6': chainBreakDistance
  '7': demonDotInterval
  '8': coefficients.entities.chainHitDamage.minecraft:advantage_physical
  '9': coefficients.entities.dotDamage.minecraft:advantage_physical
  '10': coefficients.entities.singleTargetDamage.minecraft:advantage_physical
