name:
  de: Klingenstoß
  en: Blade Dash
description:
  en:
  - <!i><#757575>Bladeweaver
  - ' '
  - <#94958B>Dash forward and launch the first enemy hit into the air.
  - <#94958B>Applies Razor Mark to launched targets.
  - ' '
  - '<#FF6600>⚔ Demon Form: <#94958B>Dash through ALL enemies in a line,'
  - <#94958B>launching and damaging them all with increased height.
  - ' '
  - '<!i><yellow>⌚ <#94958B>Cooldown: <arg:0>s'
  - '<!i><yellow>⚡ <#94958B>Energy Gain: <arg:1>'
  - '<!i><yellow>📏 <#94958B>Dash Distance: <arg:2> blocks'
  - '<!i><yellow>⬆️ <#94958B>Launch Height: <arg:4>'
  de:
  - <!i><#757575>Klingenweaver | Engagement
  - ' '
  - <#94958B>Stürme vorwärts und schleudere den ersten getroffenen Feind
  - <#94958B>in die Luft. Gibt Rasierklingen-Markierung auf geschleuderte Ziele.
  - ' '
  - '<#FF6600>⚔ Dämonenform: <#94958B>Stürme durch ALLE Feinde in einer Linie,'
  - <#94958B>schleudere und verletze sie alle mit erhöhter Höhe.
  - ' '
  - '<!i><yellow>⌚ <#94958B>Abklingzeit: <arg:0>s'
  - '<!i><yellow>⚡ <#94958B>Energiegewinn: <arg:1>'
  - '<!i><yellow>📏 <#94958B>Sturmdistanz: <arg:2> Blöcke'
  - '<!i><yellow>⬆️ <#94958B>Schleuderhöhe: <arg:4>'
# This list contains all placeholders that can be used in this spell.
# You can use those placeholders in the description with
# <arg:(index of placeholder)>. Example: <arg:1> for the first placeholder.
availablePlaceholders:
  '0': cooldown
  '1': energyBuildUpFromUse
  '2': dashDistance
  '3': dashSpeed
  '4': launchHeight
  '5': hitboxWidth
  '6': razorMarkStacks
  '7': coefficients.entities.damage.minecraft:advantage_physical
