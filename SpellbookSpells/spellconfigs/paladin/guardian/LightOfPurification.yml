  - "<#94958B>Auch ohne negativen Effekt heilt der Impuls und gewährt 2 Sekunden Resistenz."
  - "<#94958B>Feinde im Kreis erleiden magischen Schaden; Treffer füllen die Boss-Kontrollleiste."
  - "<#94958B>Entfernte Effekte erstatten bis zu 10 Hingabe."
