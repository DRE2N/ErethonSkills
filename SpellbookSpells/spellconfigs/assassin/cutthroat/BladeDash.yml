    - '<!i><yellow>   <#94958B>Schaden: <arg:8>'
    - '<!i><yellow>   <#94958B>Wunde: <arg:10>s'
  en:
    - <!i><#757575>Cutthroat | Right Click
    - ' '
    - <#94958B>Briefly shows the attack lane, then cuts through enemies.
    - <#94958B>A landed cut applies a Wound and returns up to 20 energy.
    - <#94958B>A miss leaves you exposed at the landing point. 4s cooldown.
    - ' '
    - '<!i><yellow>⚡ <#94958B>Energy: <arg:1>'
    - '<!i><yellow>   <#94958B>Damage: <arg:8>'
    - '<!i><yellow>   <#94958B>Wound: <arg:10>s'
