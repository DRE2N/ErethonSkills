name:
  de: Todesstoß
  en: Coup de Grace
description:
  de:
    - <!i><#757575>Halsabschneider
    - ' '
    - <#94958B>Markiert ein Ziel und springt dann auf einer sichtbaren Bahn.
    - <#94958B>Nur ein Treffer aus nächster Nähe verursacht Schaden.
    - <#94958B>Wunden verstärken den Treffer. Schwache gewöhnliche Mobs
    - <#94958B>erleiden einen weiteren Bonus. Spieler werden nie sofort getötet.
    - <#94958B>Ein bestätigter Kill gibt Energie zurück.
    - ' '
    - '<!i><yellow>⚡ <#94958B>Energie: <arg:0>'
  en:
    - <!i><#757575>Cutthroat
    - ' '
    - <#94958B>Mark a target, then leap along a visible lane.
    - <#94958B>Only a close landing deals damage.
    - <#94958B>Wounds amplify the strike. Weak ordinary mobs take
    - <#94958B>another bonus. Players are never killed automatically.
    - <#94958B>A confirmed kill returns energy.
    - ' '
    - '<!i><yellow>⚡ <#94958B>Energy: <arg:0>'
