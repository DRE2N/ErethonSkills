class: assassin.cutthroat.PreciseStab
energyCost: 30
targetRaySize: 0.2
bleedStacksRequired: 1
woundDuration: 7
focusedBonusPlayers: 0.3
focusedBonusEntities: 0.55
waveDamageMultiplier: 0.65
furyWaveRange: 6.0
furyWaveAngle: 60.0
name:
  de: Präziser Stich
  en: Precise Stab
description:
  de:
    - <!i><#757575>Halsabschneider
    - ' '
    - <#94958B>Trifft ein einzelnes Ziel. Ohne Wunde fügt der Stich eine Wunde zu.
    - <#94958B>Mit Wunde verbraucht er sie für einen mächtigen Treffer.
    - <#94958B>Beim Schleichen wird die Wunde stattdessen zu einer Blutwelle.
    - <#94958B>Ausweichen oder Sichtschutz während des Ausholens verhindert den Treffer.
    - ' '
    - '<!i><yellow>⚡ <#94958B>Energie: <arg:0>'
    - '<!i><yellow>   <#94958B>Schaden: <arg:7>'
    - '<!i><yellow>   <#94958B>Wellenreichweite: <arg:5> Blöcke'
  en:
    - <!i><#757575>Cutthroat
    - ' '
    - <#94958B>Strike one target. Without a Wound, the stab applies one.
    - <#94958B>With a Wound, it spends it for a heavy focused hit.
    - <#94958B>Sneak to spend the Wound on a blood wave instead.
    - <#94958B>Moving out of range or behind cover during the windup avoids the hit.
    - ' '
    - '<!i><yellow>⚡ <#94958B>Energy: <arg:0>'
    - '<!i><yellow>   <#94958B>Damage: <arg:7>'
    - '<!i><yellow>   <#94958B>Wave range: <arg:5> blocks'
coefficients:
  players:
    minecraft:advantage_physical: 1.3
  entities:
    minecraft:advantage_physical: 1.3
availablePlaceholders:
  '0': energyCost
  '1': targetRaySize
  '2': bleedStacksRequired
  '3': focusedBonusPlayers
  '4': focusedBonusEntities
  '5': furyWaveRange
  '6': furyWaveAngle
  '7': coefficients.entities.minecraft:advantage_physical
  '8': waveDamageMultiplier
  '9': woundDuration
