  de: Zerfetzen
  en: Mangle
description:
  de:
    - <!i><#757575>Halsabschneider
    - ' '
    - <#94958B>Hol weit aus und triff ein Ziel vor dir.
    - <#94958B>Eine Wunde verstärkt den Treffer und wird verbraucht.
    - <#94958B>Ein laufender Spielerzauber wird beim Wundtreffer unterbrochen.
    - <#94958B>Distanz oder Deckung während des Ausholens lassen den Schlag verfehlen.
    - ' '
    - '<!i><yellow>⚡ <#94958B>Energie: <arg:0>'
    - '<!i><yellow>   <#94958B>Reichweite: <arg:1> Blöcke'
    - '<!i><yellow>   <#94958B>Grundschaden: <arg:4>'
  en:
    - <!i><#757575>Cutthroat
    - ' '
    - <#94958B>Wind up, then strike one target in front of you.
    - <#94958B>Wound empowers the hit and is consumed.
    - <#94958B>A landed Wound hit interrupts an active player cast.
    - <#94958B>Distance or cover during the windup makes the strike miss.
    - ' '
    - '<!i><yellow>⚡ <#94958B>Energy: <arg:0>'
    - '<!i><yellow>   <#94958B>Range: <arg:1> blocks'
    - '<!i><yellow>   <#94958B>Base damage: <arg:4>'
coefficients:
