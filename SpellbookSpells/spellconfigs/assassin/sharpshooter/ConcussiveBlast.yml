class: assassin.sharpshooter.ConcussiveBlast
name:
  en: Concussive Blast
  de: Erschütternde Druckwelle
windupTicks: 5
maxKnockbackStrength: 0.7
minKnockbackStrength: 0.45
coneAngle: 60.0
coneRange: 4.0
cooldown: 12
coefficients:
  players:
    damage:
      minecraft:advantage_physical: 1.4
  entities:
    damage:
      minecraft:advantage_physical: 2.0
description:
  en:
  - <!i><#757575>Sharpshooter
  - ' '
  - <#94958B>Unleash a short-range blast of kinetic energy,
  - <#94958B>dealing minor damage while knocking back enemies
  - <#94958B>after a brief warning. No camera disruption.
  - ' '
  - '<!i><yellow>📏 <#94958B>Cone Range: <arg:1> blocks'
  - '<!i><yellow>⬆️ <#94958B>Knockback Strength: <arg:2>'

  de:
  - <!i><#757575>Sharpshooter
  - ' '
  - <#94958B>Entfessle eine kurzreichweitige kinetische Explosion,
  - <#94958B>die geringen Schaden verursacht, während Feinde
  - <#94958B>nach kurzer Warnung zurückgestoßen werden.
  - ' '
  - '<!i><yellow>📏 <#94958B>Kegel Reichweite: <arg:1> Blöcke'
  - '<!i><yellow>⬆️ <#94958B>Rückstoß Stärke: <arg:2>'

# This list contains all placeholders that can be used in this spell.
# You can use those placeholders in the description with
# <arg:(index of placeholder)>. Example: <arg:1> for the first placeholder.
availablePlaceholders:
  '0': disorientDuration
  '1': maxKnockbackStrength
  '2': minKnockbackStrength
  '3': coneAngle
  '4': coneRange
  '5': cooldown
  '6': coefficients.entities.damage.minecraft:advantage_physical
  '7': knockbackStrength
