# Keep this ID for existing hotbar icons and saved spell references.
class: assassin.sharpshooter.FieldDressing
cooldown: 22
energyCost: 0
baseHealing: 14
healingPowerCoefficient: 0.35
focusHealingPerPoint: 0.4
maximumFocusSpend: 20
playerCombatHealingMultiplier: 0.65
allyRange: 8
name:
  de: Feldversorgung
  en: Field Dressing
description:
  en:
    - <!i><#757575>Sharpshooter
    - ' '
    - <#94958B>Treat yourself or the ally you deliberately aim at.
    - <#94958B>Both receive the same base healing over four pulses.
    - <#94958B>Taking damage weakens later pulses. Self treatment slows you.
    - <#94958B>Sneak to spend up to 20 Focus for stronger treatment.
    - <#94958B>Works at zero Focus.
    - ' '
    - '<!i><yellow>⏱ <#94958B>Cooldown: <arg:0>s'
    - '<!i><yellow>   <#94958B>Base healing: <arg:2> + healing power'
  de:
    - <!i><#757575>Scharfschütze
    - ' '
    - <#94958B>Versorge dich oder einen gezielt anvisierten Verbündeten.
    - <#94958B>Beide erhalten dieselbe Grundheilung in vier Pulsen.
    - <#94958B>Schaden schwächt spätere Pulse. Selbstversorgung verlangsamt dich.
    - <#94958B>Schleiche, um bis zu 20 Fokus für stärkere Heilung einzusetzen.
    - <#94958B>Funktioniert auch ohne Fokus.
    - ' '
    - '<!i><yellow>⏱ <#94958B>Abklingzeit: <arg:0>s'
    - '<!i><yellow>   <#94958B>Grundheilung: <arg:2> + Heilkraft'
availablePlaceholders:
  '0': cooldown
  '1': energyCost
  '2': baseHealing
  '3': healingPowerCoefficient
  '4': focusHealingPerPoint
  '5': maximumFocusSpend
  '6': allyRange
