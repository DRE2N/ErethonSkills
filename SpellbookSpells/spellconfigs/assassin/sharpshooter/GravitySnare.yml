class: assassin.sharpshooter.GravitySnare
cooldown: 18
range: 32
projectileSpeed: 1.5
snareRadius: 4.0
snareDuration: 3
pullStrength: 0.08
minSlowAmplifier: 1.0
maxSlowAmplifier: 2.0
slowDuration: 1.0
name:
  de: Gravitationsfalle
  en: Gravity Snare
description:
  en:
  - <!i><#757575>Sharpshooter
  - ' '
  - <#94958B>Launch a projectile that deploys a gravitational field
  - <#94958B>after a short arming delay. Enemies in the field are slowed
  - <#94958B>and gently pulled toward its visible center.
  - ' '
  - '<!i><yellow>📏 <#94958B>Range: <arg:1> blocks'
  - '<!i><yellow>🔵 <#94958B>Snare Radius: <arg:2> blocks'
  - '<!i><yellow>⏱️ <#94958B>Snare Duration: <arg:3>s'
  - '<!i><yellow>❄️ <#94958B>Slow Amplifier: <arg:4>'
  de:
  - <!i><#757575>Sharpshooter
  - ' '
  - <#94958B>Schieße ein Projektil ab, das bei Aufprall ein
  - <#94958B>Gravitationsfeld mit kurzer Aktivierungszeit erschafft. Feinde werden
  - <#94958B>verlangsamt und leicht zur Mitte gezogen.
  - ' '
  - '<!i><yellow>📏 <#94958B>Reichweite: <arg:1> Blöcke'
  - '<!i><yellow>🔵 <#94958B>Fallen Radius: <arg:4> Blöcke'
  - '<!i><yellow>⏱️ <#94958B>Fallen Dauer: <arg:5>s'
  - '<!i><yellow>❄️ <#94958B>Verlangsamung: <arg:9> <dark_gray>(<arg:6>-<arg:7> <#0fdcfa>+♦<dark_gray>)</dark_gray>'
# This list contains all placeholders that can be used in this spell.
# You can use those placeholders in the description with
# <arg:(index of placeholder)>. Example: <arg:1> for the first placeholder.
availablePlaceholders:
  '0': cooldown
  '1': range
  '2': projectileSpeed
  '3': snareRadius
  '4': snareDuration
  '5': pullStrength
  '6': minSlowAmplifier
  '7': maxSlowAmplifier
  '8': slowDuration
  '9': slowAmplifier
