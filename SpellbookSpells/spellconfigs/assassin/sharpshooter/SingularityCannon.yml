class: assassin.sharpshooter.SingularityCannon
cooldown: 60
duration: 2
beamRange: 32.0
beamWidth: 1.5
subsequentDamageMultiplier: 0.5
singularWeaknessDuration: 5
maxFocusRefund: 20
coefficients:
  players:
    damage:
      minecraft:advantage_magical: 3.5
  entities:
    damage:
      minecraft:advantage_magical: 5.0
name:
  de: Singularitätskanone
  en: Singularity Cannon
description:
  en:
  - <!i><#757575>Sharpshooter | Ultimate
  - ' '
  - <#94958B>After a 1.5-second visible channel, unleash a
  - <#94958B>32-block beam stopped by cover. Deals immense
  - <#94958B>damage to first target, 50% to subsequent targets.
  - ' '
  - <#94958B>Enemies hit are marked with Singular Weakness for 5s,
  - <#94958B>taking 20% increased damage from Charged Shot.
  - ' '
  - '<#FFD700>💀 Kill Bonus:'
  - <#94958B>Killing an enemy with the beam instantly refunds
  - <#94958B>up to 20 Focus.
  - ' '
  - '<!i><yellow>⏱️ <#94958B>Channel Time: <arg:1>s'
  - '<!i><yellow>💥 <#94958B>Subsequent Damage: <arg:2>%'
  - '<!i><yellow>🔮 <#94958B>Weakness Duration: <arg:3>s'
  de:
  - <!i><#757575>Sharpshooter | Ultimate
  - ' '
  - <#94958B>Nach 1,5 Sekunden Kanalisierung entfessle einen
  - <#94958B>sichtbaren, 32 Block langen Strahl, den Deckung stoppt.
  - <#94958B>Er verursacht enormen Schaden am
  - <#94958B>ersten Ziel, 50% an nachfolgenden Zielen.
  - ' '
  - <#94958B>Getroffene Feinde werden mit Singulärer Schwäche für 5s
  - <#94958B>markiert und erleiden 20% mehr Schaden von Charged Shot.
  - ' '
  - '<#FFD700>💀 Tötungs-Bonus:'
  - <#94958B>Das Töten eines Feindes mit dem Strahl erstattet
  - <#94958B>sofort bis zu 20 Fokus.
  - ' '
  - '<!i><yellow>⏱️ <#94958B>Kanalisierungszeit: <arg:1>s'
  - '<!i><yellow>💥 <#94958B>Nachfolgender Schaden: <arg:2>%'
  - '<!i><yellow>🔮 <#94958B>Schwäche Dauer: <arg:3>s'
# This list contains all placeholders that can be used in this spell.
# You can use those placeholders in the description with
# <arg:(index of placeholder)>. Example: <arg:1> for the first placeholder.
availablePlaceholders:
  '0': cooldown
  '1': duration
  '2': beamRange
  '3': beamWidth
  '4': subsequentDamageMultiplier
  '5': singularWeaknessDuration
  '6': maxFocusRefund
  '7': coefficients.entities.damage.minecraft:advantage_magical
  '8': channelDuration
  '9': subsequentDamageMultiplier
  '10': singularWeaknessDuration
